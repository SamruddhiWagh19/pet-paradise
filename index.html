
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#234d42">
  <title>Pet Paradise | The Uncharted Island</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="ambient-glow"></div>
  <div class="particles" id="particles"></div>

  <main class="game-shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🌴</span>
        <span>Pet Paradise</span>
      </div>

      <div class="island-label">
        THE UNCHARTED ISLAND
      </div>
    </header>

    <section class="game-world" id="game-world">

      <div class="world-overlay"></div>

      <div class="game-content" id="app">
        <section class="game-screen welcome-screen">

          <div class="welcome-art">🏝️</div>

          <span class="step-label">A WORLD WAITING TO BE DISCOVERED</span>

          <h1>The Wild Island</h1>

          <p>
            Five possible companions. Countless secrets.
            An expedition unlike any other.
          </p>

          <button class="primary-btn" id="start-btn">
            Begin Your Expedition →
          </button>

        </section>
      </div>

    </section>

    <footer class="footer">
      Explore fearlessly. Survive wisely. Discover the unknown.
    </footer>

  </main>

  <script src="script.js"></script>
  

</body>
</html>
